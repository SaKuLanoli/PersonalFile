# DeepEval v4.2.3
# LLM 评估框架（Python + TypeScript）

## 📦 deepeval/ — Python 主包
### metrics/（332 文件，48 类指标）
#### RAG 指标
- faithfulness 忠实度
- answer_relevancy 回答相关性
- contextual_precision/recall/relevancy
- hallucination 幻觉
#### LLM-as-Judge
- g_eval（含 schema/模板）
- conversational_g_eval
- arena_g_eval
#### Agentic / 智能体指标
- task_completion 任务完成度
- tool_use / tool_correctness
- tool_permission
- mcp / mcp_use_metric
- dag / conversational_dag（DAG 工作流）
- plan_adherence / plan_quality
- goal_accuracy / step_efficiency
- agent_loop_detection
#### 安全指标
- toxicity 毒性
- bias 偏见
- misuse 滥用
- pii_leakage 隐私泄露
- non_advice
#### 多轮对话指标
- turn_faithfulness / turn_relevancy
- turn_contextual_* 系列
- conversation_completeness
- knowledge_retention
#### 多模态指标（28 文件）
- image_coherence
- image_editing
- image_helpfulness
- image_reference
- text_to_image
#### 语音指标（11 文件）
- voice/ 目录
#### 其他
- summarization 摘要
- json_correctness
- exact_match / pattern_match
- prompt_alignment
- role_adherence / role_violation
- topic_adherence
- argument_correctness
- community/ 社区贡献指标

### models/（64 文件）判题模型层
#### llms/（17 个 LLM 接入）
- openai / azure / anthropic
- gemini / grok / deepseek / kimi
- amazon_bedrock / litellm / ollama
- local 本地模型 / openrouter
- portkey / gateway
#### embedding_models/（5）
#### stt/ 语音转文字（17）
#### tts/ 文字转语音（13）
#### 本地小模型
- detoxify（毒性）
- summac（摘要）
- unbias（偏见）

### benchmarks/（127 文件，19 个基准）
- MMLU / GSM8K / HumanEval
- HellaSwag / BIG-Bench Hard（60 文件）
- DROP / SQuAD / TruthfulQA
- BBQ / IFEval / MATH-QA
- LogiQA / Winogrande / LAMBADA
- BoolQ / ARC / EquityMedQA

### evaluate/（16 文件）执行引擎
- evaluate.py 主入口
- console_report 终端报告
- local_store 本地结果存储
- compare 对比多次评估
- execute/ 并发执行

### test_case/ + dataset/ 数据结构
- LLMTestCase 单轮
- ConversationalTestCase 多轮
- ArenaTestCase / mcp.py
- EvaluationDataset / Golden 金标准

### synthesizer/（14 文件）
- 合成测试数据生成
- chunking 文档分块
- templates 生成模板

### simulator/（21 文件）对话模拟器
- conversation_simulator
- simulation_graph 模拟图
- 生命周期钩子 / 停止逻辑
- 人物角色模板

### voice/（36 文件）语音评测
- duplex 全双工
- floor_control 轮次控制
- interruption 打断处理
- turn_detection / streaming
- connectors/（24 个连接器）

### tracing/（23 文件）可观测性
- instrument 装饰器追踪
- otel/ OpenTelemetry 导出
- offline_evals 离线评估
- patchers 自动插桩

### integrations/（34 文件）框架集成
- langchain / llama_index
- crewai / pydantic_ai
- google_adk / strands / agentcore
- hugging_face / openinference

### optimizer/（38 文件）提示词优化
- prompt_optimizer
- algorithms/（22 个算法，如 DSPy）
- scorer / rewriter

### cli/（39 文件）命令行工具
- `deepeval test` 跑测试
- generate 生成数据/指标
- auth 登录 Confident AI
- providers/（21 个 LLM 接入配置）
- diagnose 诊断

### inspect/（14 文件）TUI 检查器
- Textual 终端 UI
- widgets/ 7 个组件

### confident/ — Confident AI 云平台 API

### 其他模块
- prompt/ 提示词管理
- telemetry/ 遥测
- plugins/ 插件系统
- scorer / sqlite_store
- anthropic|openai|openai_agents 插桩
- red_teaming 红队（规划中）
- config / annotation / test_run
