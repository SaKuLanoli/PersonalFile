  .scenrow2 .sv { width:34px; text-align:right; font-weight:800; font-size:15px; }
  .scenrow2 .p0 { color:var(--red); font-size:11.5px; width:46px; text-align:right; }

  .act:hover { border-color:var(--acc); color:var(--acc); }
  pre.report { background:#F4F4F8; border:1px solid var(--line); border-radius:10px; padding:16px; font-size:12px; line-height:1.7; overflow:auto; max-height:480px; font-family:Consolas,monospace; white-space:pre-wrap; }
  details summary { cursor:pointer; color:var(--acc); font-size:13px; }
  .shell { display:flex; gap:0; max-width:1240px; margin:0 auto; padding:0 28px 70px; }
  .side { width:215px; flex-shrink:0; padding:24px 0; }

  .sitem:hover { background:#F3F3F8; color:var(--ink); }

  .opbar { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:18px; flex-wrap:wrap; }

<body>
<header class="topbar">
  <div class="brand"><span class="logo">Q</span>教育Agent质量检测</div>
  <nav class="toptabs">
    <button class="toptab on" id="tab-dash" onclick="switchTab('dash')">质量看板</button>
    <button class="toptab" id="tab-spec" onclick="switchTab('spec')">规范中心</button>
  </nav>
  <div class="topright">
    <select class="prod" id="prodSel" onchange="onSelectProduct()"></select>
    <span class="badge" id="judgeMode">裁判：—</span>
    <button class="btn" id="rerunBtn" onclick="rerun()">▶ 检测此智能体</button>
  </div>
</header>

<!-- ============ 页面1：质量看板 ============ -->
<main id="page-dash">
  <section class="blk">
    <h2 class="sec">检测覆盖地图</h2>
    <div class="sub">块面积 = 场景权重 · 颜色 = 所属智能体 · 角标 = 最近得分（点击块切换智能体）</div>
    <div class="tmap" id="tmap"></div>
    <div class="legend" id="tmapLegend"></div>
  </section>
  <section class="blk">
    <h2 class="sec" id="heroName">—</h2>
    <div class="sub" id="heroSub"></div>
    <div class="card hero">
      <div id="heroDonut"></div>
      <div class="scenlist" id="heroScen"></div>
    </div>
  </section>
  <section class="blk">
    <div class="statrow">
      <div class="stat"><div class="k">重点问题（安全违规 / 严重知识性错误）</div><div class="v" id="stP0" style="color:var(--red)">—</div></div>
      <div class="stat"><div class="k">趋势预警（场景质量分环比下降）</div><div class="v" id="stP1" style="color:var(--amber)">—</div></div>
      <div class="stat"><div class="k">问题清单 待复核</div><div class="v" id="stBC" style="color:var(--acc)">—</div></div>
    </div>
    <div class="card" id="alertsBox"><div class="empty">加载中…</div></div>
  </section>
  <section class="blk">
    <h2 class="sec">问题清单</h2>
    <div class="sub">确认后进入修复排期，误报回填规则迭代；每条问题可追溯到规则ID</div>
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>级别</th><th>检出方式</th><th>场景</th><th>样本与问题</th><th>总分</th><th>状态</th><th>处置</th></tr></thead>
        <tbody id="bcRows"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>
  <section class="blk">
    <h2 class="sec">质量日报</h2>
    <div class="card">
      <details><summary>展开最新日报（Markdown，归档于 data/reports/）</summary>
      <pre class="report" id="report" style="margin-top:10px">加载中…</pre></details>
    </div>
  </section>
</main>

<!-- ============ 页面2：规范中心（侧栏导航） ============ -->
<div id="page-spec" style="display:none">
  <div class="shell">
    <aside class="side" id="sideNav"></aside>
    <div class="specmain">
      <div id="specHead"></div>
      <div id="specBody"></div>
    </div>
  </div>
</div>

}

}

/* ---------- 质量看板 ---------- */
function squarify(items, x, y, w, h, out) {
  if (!items.length) return;
  if (items.length === 1) { out.push({ x, y, w, h, it: items[0] }); return; }
  const total = items.reduce((s, i) => s + i.value, 0);
  let acc = 0, idx = items.length - 1;
  for (let i = 0; i < items.length; i++) { acc += items[i].value; if (acc >= total / 2) { idx = i + 1; break; } }
  const a = items.slice(0, idx), b = items.slice(idx);
  const sa = a.reduce((s, i) => s + i.value, 0), st = sa + (total - sa);
  if (w >= h) { const wA = w * sa / st; squarify(a, x, y, wA, h, out); squarify(b, x + wA, y, w - wA, h, out); }
  else { const hA = h * sa / st; squarify(a, x, y, w, hA, out); squarify(b, x, y + hA, w, h - hA, out); }
}
function renderTreemap(ov) {
  const tiles = [];
  (ov.products || []).forEach(p => (p.scenarios || []).forEach(s =>
    tiles.push({ value: Math.max(s.weight, 0.01), pid: p.id, pname: p.name, name: s.name,
                 weight: s.weight, score: s.score })));
  tiles.sort((a, b) => b.value - a.value);
  const placed = []; squarify(tiles, 0, 0, 100, 100, placed);
  $('tmap').innerHTML = placed.map(t => {
    const fam = FAM[t.it.pid] || { c: '#8891A0' };
    return `<div class="tile" style="left:${t.x}%;top:${t.y}%;width:${t.w}%;height:${t.h}%;background:${fam.c}"
      onclick="pickProduct('${esc(t.it.pid)}')" title="${esc(t.it.pname)}·${esc(t.it.name)}">
      <div class="tn">${esc(t.it.name)}</div><div class="tw">${esc(t.it.pname)} · 权重${Math.round(t.it.weight * 100)}%</div>
      <div class="ts">${t.it.score ?? '—'}</div></div>`;
  }).join('');
  $('tmapLegend').innerHTML = Object.entries(FAM).filter(([pid]) => (ov.products || []).some(p => p.id === pid))
    .map(([pid, f]) => {
      const share = (ov.products || []).filter(p => p.id === pid)
        .reduce((s, p) => s + (p.scenarios || []).reduce((a, x) => a + x.weight, 0), 0);
      return `<span><i style="background:${f.c}"></i>${esc(f.n)}（权重合计 ${Math.round(share * 100)}%）</span>`;
    }).join('');
}
function donut(score) {
  const c = 2 * Math.PI * 52, col = scoreColor(score || 0);
  return `<svg width="150" height="150" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="52" fill="none" stroke="#F0F0F5" stroke-width="13"/>
    <circle cx="70" cy="70" r="52" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${((score || 0) / 100 * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 70 70)"/>
    <text x="70" y="67" text-anchor="middle" font-size="31" font-weight="800" fill="#1C1F26">${score ?? '—'}</text>
    <text x="70" y="90" text-anchor="middle" font-size="12" fill="#707382">/ 100</text></svg>`;
}
function renderHero(p, dims) {

  $('heroName').innerHTML = `<span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:${(FAM[p.id] || {}).c || '#8891A0'};margin-right:8px"></span>${esc(p.name)}`;

function renderAlerts(ov) {

async function loadDash() {
  const ov = await (await fetch('/api/overview')).json();

  if (!SEL || !CATALOG.find(x => x.id === SEL)) SEL = (CATALOG[0] || {}).id || '';
  $('prodSel').innerHTML = CATALOG.map(p => {
    const run = (ov.products || []).find(x => x.id === p.id);
    return `<option value="${esc(p.id)}" ${p.id === SEL ? 'selected' : ''}>${esc(p.name)}${run ? '' : '（未检测）'}</option>`;
  }).join('');
  $('judgeMode').textContent = '裁判：' + (ov.judge_mode || '—');
  renderTreemap(ov);

  renderHero(mine, mine ? (mine.dims || []) : []);

async function rerun() {
  if (!SEL) return;
  const btn = $('rerunBtn');
  btn.disabled = true; btn.textContent = '检测中…';
  await fetch('/api/rerun', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ product_id: SEL }) });
  await loadDash();
  if ($('page-spec').style.display !== 'none') loadSpec();

}
async function deal(id, action) {
  await fetch('/api/badcase', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sample_id: id, action }) });
  loadDash();
}

function ruleParams(r) {
  const w = SPEC.words || {};

  if (r.id === 'overage_term') return Object.entries(w.overage || {}).map(x => '<b style="color:#3C3F52">' + esc(BANDN[x[0]] || x[0]) + '</b>（' + x[1].length + '）：' + esc(x[1].join('、'))).join('<br>') || '词表为空';
  if (r.id === 'harsh_tone') return '当前词表（' + (w.harsh_tone || []).length + '个）：' + esc((w.harsh_tone || []).join('、'));
  if (r.id === 'missing_marker') {
    const ls = SPEC.scenarios.flatMap(p => p.scenarios.filter(x => (x.required_markers || []).length)
      .map(x => esc(x.name) + '：' + esc(x.required_markers.join('、'))));
    return ls.join('<br>') || '暂未配置必备要素';
  }
  if (r.id === 'steps_check') {

    return ls.join('<br>') || '暂未启用';
  }
  if (r.id === 'answer_verify') return '自动识别等式：整数/小数/分数、单步与连续运算（＋ − × ÷），无需配置。';
  if (r.id === 'answer_contradiction') return '识别「答案：X」与「因此/所以…选Y」两处表述，无需配置。';

    <tr><td style="white-space:nowrap">${esc(a.ts)}</td><td>${esc(a.operator)}</td><td>${esc(a.section)}</td>
    <td>${esc(a.summary)}${a.detail ? '<span style="color:var(--muted)">　' + esc(a.detail) + '</span>' : ''}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">暂无变更记录。</td></tr>';
}
function renderWords() {
  const w = SPEC.words || {};
  let wh = '';
  Object.entries(w.sensitive || {}).forEach(([cat, ws]) => {
    wh += `<div><label>敏感词 · ${esc(cat)}</label><textarea class="cfg" data-wk="sensitive.${esc(cat)}">${esc(ws.join('、'))}</textarea></div>`;
  });
  wh += `<div><label>语气词（儿童对话）</label><textarea class="cfg" data-wk="harsh_tone">${esc((w.harsh_tone || []).join('、'))}</textarea></div>`;
  Object.entries(w.overage || {}).forEach(([band, ws]) => {
    wh += `<div><label>超纲词表 · ${BANDN[band] || esc(band)}</label><textarea class="cfg" data-wk="overage.${esc(band)}">${esc(ws.join('、'))}</textarea></div>`;
  });
  $('wordGrid').innerHTML = wh;
}
/* ---- 提示词约束库 ---- */
function renderPc() {
  const layers = SPEC.constraints.layers || [];
  $('pcCfg').innerHTML = layers.map((l, li) => `
    <div class="card" style="margin-bottom:14px" data-layer="${li}">
      <div class="scenrow3" style="border:none">
        <span class="tag">约束层</span>
        <input class="cfg s-in" data-lf="id" value="${esc(l.id || '')}" placeholder="层ID如KC" style="width:90px">
        <input class="cfg" data-lf="name" value="${esc(l.name || '')}" placeholder="层名称，如：课程知识边界对齐" style="width:300px">
        <button class="act" style="margin-left:auto" onclick="this.closest('.card').remove()">删除本层</button>
      </div>
      <table style="margin-top:6px">
        <thead><tr><th style="width:44px">启用</th><th style="width:110px">断言ID</th><th>约束断言（生成结果应满足什么）</th><th style="width:150px">核对方式</th><th style="width:120px">重点约束</th><th style="width:40px"></th></tr></thead>
        <tbody>
        ${(l.assertions || []).map(a => pcRow(a)).join('')}
        </tbody>
      </table>
      <button class="act" style="margin-top:8px" onclick="addAssertion(this)">＋ 添加断言</button>
    </div>`).join('') || '<div class="empty">尚未配置约束层，点击下方「添加约束层」开始。</div>';
}
function pcRow(a) {
  a = a || { id: '', text: '', check: 'judge', rule_id: '', critical: false, enabled: true };
  return `<tr>
    <td><input type="checkbox" data-af="enabled" ${a.enabled ? 'checked' : ''}></td>
    <td><input class="cfg" style="width:110px;font-family:Consolas,monospace" data-af="id" value="${esc(a.id || '')}" placeholder="PC-XX-01"></td>
    <td><input class="cfg" data-af="text" value="${esc(a.text || '')}" placeholder="约束断言：生成结果应满足什么"></td>
    <td>
      <select class="cfg" data-af="check" style="width:120px" onchange="this.closest('tr').querySelector('[data-af=rule_id]').style.display = this.value==='rule' ? '' : 'none'">
        <option value="judge" ${a.check === 'judge' ? 'selected' : ''}>裁判核对</option>
        <option value="rule" ${a.check === 'rule' ? 'selected' : ''}>关联规则</option>
        <option value="manual" ${a.check === 'manual' ? 'selected' : ''}>人工复核</option>
      </select>
      <input class="cfg" style="width:120px;display:${a.check === 'rule' ? '' : 'none'}" data-af="rule_id" value="${esc(a.rule_id || '')}" placeholder="规则ID如len_check">
    </td>
    <td><input type="checkbox" data-af="critical" ${a.critical ? 'checked' : ''}></td>
    <td><button class="act" onclick="this.closest('tr').remove()">删</button></td>
  </tr>`;
}
function addAssertion(btn) {
  btn.closest('.card').querySelector('tbody').insertAdjacentHTML('beforeend', pcRow({}));
}
function addLayer() {
  const div = document.createElement('div');
  div.className = 'card'; div.style.marginBottom = '14px'; div.dataset.layer = 'new';
  div.innerHTML = `<div class="scenrow3" style="border:none">
      <span class="tag">约束层</span>
      <input class="cfg s-in" data-lf="id" placeholder="层ID如KC" style="width:90px">
      <input class="cfg" data-lf="name" placeholder="层名称" style="width:300px">
      <button class="act" style="margin-left:auto" onclick="this.closest('.card').remove()">删除本层</button>
    </div>
    <table><thead><tr><th style="width:44px">启用</th><th style="width:110px">断言ID</th><th>约束断言</th><th style="width:150px">核对方式</th><th style="width:120px">重点约束</th><th style="width:40px"></th></tr></thead>
    <tbody></tbody></table>
    <button class="act" style="margin-top:8px" onclick="addAssertion(this)">＋ 添加断言</button>`;
  $('pcCfg').appendChild(div);
}
async function savePc() {
  const layers = [];
  document.querySelectorAll('#pcCfg .card[data-layer]').forEach(card => {
    const assertions = [];
    card.querySelectorAll('tbody tr').forEach(tr => {
      const g = f => tr.querySelector(`[data-af="${f}"]`);
      if (!g('id')) return;
      assertions.push({
        id: g('id').value.trim(), text: g('text').value.trim(),
        check: g('check').value, rule_id: g('rule_id').value.trim(),
        critical: g('critical').checked, enabled: g('enabled').checked,
      });
    });
    layers.push({
      id: card.querySelector('[data-lf="id"]').value.trim(),
      name: card.querySelector('[data-lf="name"]').value.trim(),
      assertions,
    });
  });
  const res = await (await fetch('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ section: 'constraints', operator: operator(), payload: { product_id: SEL, layers } }) })).json();
  tip('pcTip', res.ok, res.summary || res.error || '');
  loadSpec();
}
function renderScenCfg() {
  let sh = '';
  SPEC.scenarios.forEach(p => p.scenarios.forEach(sc => {
    const rl = sc.response_len ? sc.response_len[0] + '-' + sc.response_len[1] : '';
    sh += `<div class="scenrow3" data-pid="${esc(p.id)}" data-sid="${esc(sc.id)}">
      <span class="tag">${esc(sc.name)}</span>
      权重% <input class="cfg w-num" data-f="weight" type="number" step="5" value="${Math.round(sc.weight * 100)}">
      学段 <input class="cfg s-in" data-f="grade" value="${esc(sc.grade || '')}">
      必备要素 <input class="cfg" style="width:210px" data-f="markers" value="${esc((sc.required_markers || []).join(','))}">
      最少步骤 <input class="cfg w-num" data-f="min_steps" type="number" value="${sc.min_steps || ''}">
      字数口径 <input class="cfg s-in" style="width:110px" data-f="response_len" value="${rl}" placeholder="50-100">
    </div>`;
  }));
  $('scenCfg').innerHTML = sh;
}
async function loadSpec() {
  SPEC = await (await fetch('/api/specs?product=' + encodeURIComponent(SEL))).json();
  renderSide();
  renderSpecView();
}
async function saveDims() {
  const dims = Array.from(document.querySelectorAll('input[data-dim]')).filter(x => x.checked).map(x => x.dataset.dim);
  const res = await (await fetch('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ section: 'dims', operator: operator(), payload: { product_id: SEL, dims } }) })).json();
  tip('dimTip', res.ok, res.summary || res.error || '');
  loadSpec();
}
async function saveRules() {
  const rules = SPEC.rules.map(r => ({
    id: r.id,
    enabled: !!document.querySelector(`input[data-rid="${r.id}"][data-f="enabled"]`).checked,
    penalty: r.level === 'warn' ? Number(document.querySelector(`input[data-rid="${r.id}"][data-f="penalty"]`).value || 0) : 0,
  }));
  const res = await (await fetch('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ section: 'rules', operator: operator(), payload: { product_id: SEL, rules } }) })).json();
  tip('ruleTip', res.ok, res.summary || res.error || '');
  loadSpec();
}
async function saveWords() {
  const words = { sensitive: {}, overage: {} };
  document.querySelectorAll('textarea[data-wk]').forEach(t => {
    const ws = t.value.split(/[,，、\s]+/).filter(x => x);
    const key = t.dataset.wk;
    if (key.startsWith('sensitive.')) words.sensitive[key.slice(10)] = ws;
    else if (key.startsWith('overage.')) words.overage[key.slice(8)] = ws;
    else words[key] = ws;
  });
  const res = await (await fetch('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ section: 'words', operator: operator(), payload: { words } }) })).json();
  tip('wordTip', res.ok, res.summary || res.error || '');
  loadSpec();
}
async function saveScen() {
  const items = [];
  document.querySelectorAll('.scenrow3').forEach(row => {
    const g = f => row.querySelector(`[data-f="${f}"]`).value.trim();
    const rl = g('response_len').match(/^(\d+)\s*-\s*(\d+)$/);
    items.push({
      product_id: row.dataset.pid, scenario_id: row.dataset.sid,
      weight: (Number(g('weight')) || 0) / 100, grade: g('grade'),
      required_markers: g('markers') ? g('markers').split(/[,，、]+/).map(x => x.trim()).filter(x => x) : [],
      min_steps: g('min_steps') ? Number(g('min_steps')) : null,
      response_len: rl ? [Number(rl[1]), Number(rl[2])] : null,
    });
  });
  const res = await (await fetch('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ section: 'scenarios', operator: operator(), payload: { items } }) })).json();
  tip('scenTip', res.ok, res.summary || res.error || '');
  loadSpec();
}
async function saveThr() {
  const payload = { product_id: SEL, thresholds: { total_below: Number($('thrTotal').value), dim_below: Number($('thrDim').value), p1_drop: Number($('thrP1').value) } };
  const res = await (await fetch('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ section: 'thresholds', operator: operator(), payload }) })).json();
  tip('thrTip', res.ok, res.summary || res.error || '');
}
loadDash();
</script>
</body>
</html>
